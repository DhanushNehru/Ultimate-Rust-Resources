name: Issue Auto Reply

on:
  issues:
    types: [opened]

permissions:
  issues: write
  contents: read

jobs:
  comment:
    if: ${{ github.event.issue.pull_request == null }} # To ignore PR
    runs-on: ubuntu-latest
    steps:
      - name: Post welcome comment
        uses: peter-evans/create-or-update-comment@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          issue-number: ${{ github.event.issue.number }}
          body: |
            Thank you for raising this issue! Our team will review it soon.

            For more queries or discussions or approval of requests, please join the Discord server for further discussion:
            https://discord.com/invite/Yn9g6KuWyA
